type Query {
    movies: [Movie!]!
    movie_with_id(id: String!): Movie
    movie_with_title(title: String!): Movie
}

type Mutation {
    add_movie(title: String!, rating: Float!, director: String!): Movie!
    update_movie(id: String!, title: String, rating: Float, director: String): Movie
    delete_movie(id: String!): Movie
}

type Movie {
    id: String!
    title: String!
    rating: Float!
    director: String!
}
